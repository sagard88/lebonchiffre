# Vérifie que les 4 secrets fonctionnent, sans rien publier (lancement manuel).
name: Test des secrets
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Instagram
        env:
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
        run: |
          curl -sf "https://graph.instagram.com/v23.0/me?fields=username&access_token=$INSTAGRAM_TOKEN" | jq -e .username
      - name: Gemini
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
        run: |
          curl -sf -H "x-goog-api-key: $GEMINI_KEY" "https://generativelanguage.googleapis.com/v1beta/models?pageSize=1" | jq -e '.models | length > 0'
      - name: GitHub (GH_PAT)
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          gh api repos/sagard88/lebonchiffre-images/git/ref/heads/main --jq .ref
          gh api repos/sagard88/lebonchiffre/actions/secrets/public-key --jq .key_id
      - name: Claude
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          npm install -g -s @anthropic-ai/claude-code
          claude -p "Réponds seulement : OK" --model haiku --max-turns 1
