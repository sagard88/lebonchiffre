# Passages de Claude : 7 h (posts de 8 h et 14 h) et 18 h (post de 19 h), heure de Paris.
# Lancés par l'horloge du script Google (gabarit/commande-mail.gs) : les horaires de GitHub arrivent avec des heures de retard.
# Mode essai, à la main : prépare un post sans le publier.
name: Preparation
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'matin, soir ou essai'
        required: true
        default: matin
# Son propre groupe : dans un groupe partagé, une tâche en attente est annulée par la suivante.
concurrency:
  group: lebonchiffre-preparation
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  preparation:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Veille
        run: VEILLE_SANS_ALERTE=1 node gabarit/veille.js || true
      - name: Claude prépare les posts
        if: hashFiles('PAUSE') == ''
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
        run: bash gabarit/ci-claude.sh ${{ github.event.inputs.mode }}
      - name: Enregistrer
        if: always()
        run: bash gabarit/ci-commit.sh "Préparation ${{ github.event.inputs.mode }} du $(TZ=Europe/Paris date '+%d/%m')"
