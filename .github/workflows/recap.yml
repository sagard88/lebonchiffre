# Récapitulatif chaque soir à 21 h 30 (heure de Paris) : une issue du dépôt, que GitHub envoie par e-mail.
# Lancé par l'horloge du script Google (gabarit/commande-mail.gs).
name: Recap
on:
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  recap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Envoyer le récapitulatif
        env:
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          VEILLE_SANS_ALERTE=1 node gabarit/veille.js > /dev/null || true
          node gabarit/recap.js > /tmp/recap.md
          printf '\n\n@%s' "${{ github.repository_owner }}" >> /tmp/recap.md
          # Les récapitulatifs précédents sont fermés pour garder la liste propre.
          for n in $(gh issue list --label recap --state open --json number --jq '.[].number'); do gh issue close "$n"; done
          gh label create recap --color FFD60A --force > /dev/null
          gh issue create --title "Récap du $(TZ=Europe/Paris date '+%d/%m/%Y')" --label recap --body-file /tmp/recap.md
